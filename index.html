<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealTrack — Ideal Technology Solutions (prototype)</title>
<meta name="description" content="Clickable prototype of MealTrack, a school meal management app by Ideal Technology Solutions.">
<link rel="icon" href="images/ideal-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>
<noscript>This prototype needs JavaScript.</noscript>
<script type="text/x-template" id="app-template">
<div style="min-height: 100vh; background: #F4F6F9; font-family: Inter, system-ui, sans-serif; color: #0F172A">

<!-- ============ SIGN IN ============ -->
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap">
<section style="flex: 1 1 520px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; background: #FFFFFF">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px">
<img src="images/ideal-logo.png" alt="Ideal Technology Solutions, LLC" style="width: 240px; height: auto; align-self: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; letter-spacing: -0.02em">Sign in to MealTrack</h1>
<p style="margin: 0; font-size: 15px; color: #475569">Daily meal counts, attestations and reports for your school.</p>
</div>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px">I am signing in as</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{loginRoles}}" as="r" hint-placeholder-count="2">
<button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="min-height: 52px; border-radius: 12px; border: 2px solid; font-size: 14px; font-weight: 600; cursor: pointer; {{r.style}}">{{r.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="lg-school" style="font-size: 13px; font-weight: 600; color: #334155">School</label>
<select id="lg-school" value="{{loginSchool}}" onChange="{{onLoginSchool}}" style="height: 48px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 15px; background: #FFFFFF; color: #0F172A">
<option value="Beacon">Beacon Elementary School</option>
<option value="Tyrone">Tyrone Elementary School</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="lg-email" style="font-size: 13px; font-weight: 600; color: #334155">School email</label>
<input id="lg-email" type="email" value="{{loginEmail}}" onChange="{{onLoginEmail}}" placeholder="name@hwschools.org" autocomplete="username" style="height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="lg-pw" style="font-size: 13px; font-weight: 600; color: #334155">Password</label>
<input id="lg-pw" type="password" value="{{loginPw}}" onChange="{{onLoginPw}}" autocomplete="current-password" style="height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A">
</div>
<sc-if value="{{hasLoginErr}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FEF3F2; border: 1px solid #FECDCA; color: #912018; font-size: 14px">{{loginErr}}</p>
</sc-if>
<button type="button" onClick="{{signIn}}" style="height: 52px; border-radius: 12px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 16px; cursor: pointer">Sign in</button>
<p style="margin: 0; font-size: 13px; color: #475569; text-align: center">or sign in with your district Google / Microsoft account</p>
<div style="border: 1px dashed #94A3B8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #F8FAFC">
<span style="font-size: 12px; font-weight: 700; color: #475569; letter-spacing: 0.06em; text-transform: uppercase">Sample accounts for the demo · tap to fill</span>
<sc-for list="{{sampleAccts}}" as="a" hint-placeholder-count="3">
<button type="button" onClick="{{a.fill}}" style="display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; cursor: pointer; color: #0F172A">
<span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px; font-weight: 700; {{a.avStyle}}">{{a.ini}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1"><span style="font-weight: 600; font-size: 14px">{{a.name}} · {{a.where}}</span><span style="font-size: 12px; color: #475569; font-family: ui-monospace, Menlo, monospace">{{a.email}} / {{a.pw}}</span></span>
</button>
</sc-for>
</div>
</div>
</section>
<section style="flex: 1 1 520px; background: #0F172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
<div style="width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 16px; background: #FFFFFF; color: #0F172A; border-radius: 16px; padding: 14px 18px; align-self: flex-start">
<img src="images/hws-logo.png" alt="Harper Woods Schools" style="width: 56px; height: 56px; object-fit: contain">
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 12px; color: #475569; font-weight: 500">Licensed to</span>
<span style="font-size: 17px; font-weight: 700; color: #6B1719">Harper Woods Schools</span>
</div>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 38px; line-height: 1.1; letter-spacing: -0.02em">Every child counted, every meal accounted for.</h2>
<div style="display: flex; gap: -10px">
<sc-for list="{{loginFaces}}" as="f" hint-placeholder-count="6">
<span class="{{f.photo}}" aria-hidden="true" style="display: block; flex: none; width: 56px; height: 56px; border-radius: 999px; border: 3px solid #0F172A; margin-right: -12px; {{f.photoBg}}"></span>
</sc-for>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
<li style="font-size: 15px; line-height: 1.5; color: #E2E8F0">Teachers tap each child's breakfast, lunch, snack or dinner — the screen switches by time of day.</li>
<li style="font-size: 15px; line-height: 1.5; color: #E2E8F0">Submit with a typed digital signature — the attestation goes straight to Food Service.</li>
<li style="font-size: 15px; line-height: 1.5; color: #E2E8F0">Room and school master reports are emailed and saved for charts by day, week and month.</li>
</ul>
<p style="margin: 0; font-size: 13px; color: #94A3B8">Beacon Elementary · Tyrone Elementary — MealTrack is a product of Ideal Technology Solutions, LLC.</p>
</div>
</section>
</div>
</sc-if>

<!-- ============ APP SHELL ============ -->
<sc-if value="{{isApp}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh">

<aside style="flex: 1 1 248px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 8px">
<img src="images/ideal-logo.png" alt="Ideal Technology Solutions" style="width: 180px; height: auto">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">MealTrack</span>
</div>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{nav}}" as="sec" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; color: #64748B; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 12px 6px">{{sec.title}}</span>
<sc-for list="{{sec.items}}" as="n" hint-placeholder-count="3">
<button type="button" aria-current="{{n.current}}" onClick="{{n.go}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; font-size: 14px; text-align: left; cursor: pointer; {{n.style}}">
<span>{{n.label}}</span>
<sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; {{n.badgeStyle}}">{{n.badge}}</span>
</sc-if>
</button>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px">
<img src="images/hws-logo.png" alt="Harper Woods Schools" style="width: 40px; height: 40px; object-fit: contain">
<div style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-size: 11px; color: #475569">Licensed to</span>
<span style="font-size: 13px; font-weight: 700; color: #6B1719">Harper Woods Schools</span>
</div>
</div>
</aside>

<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
<header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #475569; font-weight: 500">{{today}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">{{screenTitle}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="School" style="display: flex; background: #F1F5F9; border-radius: 12px; padding: 4px; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: #475569; padding: 0 4px 0 8px; align-self: center">School</span>
<sc-for list="{{schoolSeg}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 36px; padding: 0 12px; border-radius: 9px; border: 0; font-size: 13px; font-weight: 600; cursor: pointer; {{o.style}}">{{o.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<label for="room-filter" style="font-size: 12px; font-weight: 600; color: #475569">Classroom</label>
<select id="room-filter" value="{{roomF}}" onChange="{{onRoomF}}" style="height: 40px; min-width: 190px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #0F172A">
<sc-for list="{{roomFOpts}}" as="o" hint-placeholder-count="6"><option value="{{o.v}}">{{o.label}}</option></sc-for>
</select>
<sc-if value="{{roomFiltered}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{clearRoomF}}" style="height: 40px; padding: 0 10px; border: 0; background: none; color: #0A6E8C; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline">Clear</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{isTeacher}}" hint-placeholder-val="{{ true }}">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #E2E8F0; border-radius: 999px; font-size: 13px; font-weight: 600">{{tSchoolFull}} · {{tRoom}}</span>
</sc-if>
<button type="button" onClick="{{switchRole}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px dashed #94A3B8; background: #FFFFFF; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer">Demo: switch to {{otherRole}}</button>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #FFFFFF; {{userAvatarStyle}}">{{userInitials}}</div>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 13px; font-weight: 600">{{userName}}</span>
<button type="button" onClick="{{signOut}}" style="border: 0; background: none; padding: 0; color: #0A6E8C; font-size: 12px; text-align: left; cursor: pointer; text-decoration: underline">Sign out</button>
</div>
</div>
</div>
</header>

<main style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; width: 100%; box-sizing: border-box">

<!-- ============ TEACHER: MEAL REGISTER ============ -->
<sc-if value="{{isRegister}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">

<sc-if value="{{showReminder}}" hint-placeholder-val="{{ true }}">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #FFF4E5; border: 1px solid #FBD38D; color: #7A3E00; font-size: 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span><strong>Reminder sent by email and text:</strong> {{reminderText}}</span>
</div>
</sc-if>

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; letter-spacing: -0.02em">{{tRoom}} · Student meal register</h1>
<span style="font-size: 14px; color: #475569">{{tGrade}} · {{rTotal}} students · Signed in as {{userName}}, so only your classroom is shown. Tap a photo to open a profile.</span>
<sc-if value="{{isGSRP}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: #FFF4E5; border: 1px solid #FBD38D; color: #7A3E00; font-size: 13px">
<strong>GSRP pre-K room · breakfast and lunch only.</strong>
<span>No meal choices: every child marked present is served breakfast and lunch. Counts are reported separately from K–5.</span>
</div>
</sc-if>
</div>
</section>

<section aria-label="Today's count" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0A6E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-weight: 700; font-size: 17px">Morning meal count · {{periodLabel}}</span>
<span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; {{dueStyle}}">{{dueLabel}}</span>
</div>
<span style="font-size: 14px; color: #475569">{{dueText}}</span>
</div>
</section>

<section aria-label="Summary" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 8px 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E2E8F0; font-size: 13px"><strong>{{present}}</strong> present</span>
<span style="padding: 8px 12px; border-radius: 10px; background: #FEF3F2; border: 1px solid #FECDCA; color: #912018; font-size: 13px"><strong>{{absent}}</strong> absent</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{allPresent}}" disabled="{{locked}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; cursor: pointer">Mark all present</button>
<sc-if value="{{notGSRP}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{fillFirst}}" disabled="{{locked}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; cursor: pointer">Fill the rest: {{fillLabel}}</button>
</sc-if>
</div>
</section>
<section aria-label="Meal totals" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px">
<sc-for list="{{mealSummary}}" as="ms" hint-placeholder-count="3">
<div style="padding: 12px 14px; border-radius: 12px; background: #E6F6FA; border: 1px solid #B6E3EF; color: #074F66; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em">{{ms.label}}</span>
<span style="font-size: 14px">{{ms.text}}</span>
</div>
</sc-for>
</section>

<sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #ECFDF3; border: 1px solid #ABEFC6; color: #085D3A; font-size: 14px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
<span style="flex: 1"><strong>{{lockedText}}</strong> The room report was emailed to the Food Service Admin and saved to Reports.</span>
<button type="button" onClick="{{amend}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #085D3A; background: #FFFFFF; color: #085D3A; font-weight: 700; font-size: 13px; cursor: pointer">Correct the count</button>
</div>
</sc-if>

<section aria-label="Students" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px">
<sc-for list="{{cards}}" as="s" hint-placeholder-count="12">
<article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; {{s.cardStyle}}">
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{s.open}}" aria-label="Open profile for {{s.name}}" style="padding: 0; border: 0; background: none; cursor: pointer; flex: none; border-radius: 999px">
<span class="{{s.photo}}" aria-hidden="true" style="display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #334155; width: 60px; height: 60px; border-radius: 999px; {{s.photoStyle}}; {{s.photoBg}}">{{s.ini}}</span>
</button>
<div style="display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px">
<button type="button" onClick="{{s.open}}" style="padding: 0; border: 0; background: none; text-align: left; font-weight: 700; font-size: 16px; color: #0F172A; cursor: pointer">{{s.name}}</button>
<span style="font-size: 12px; color: #475569">ID {{s.sid}}</span>
<sc-if value="{{s.hasAlert}}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; color: #7A3E00; background: #FFF4E5; border: 1px solid #FBD38D; padding: 2px 8px; border-radius: 999px">{{s.alert}}</span>
</sc-if>
</div>
</div>
<div role="group" aria-label="Attendance for {{s.name}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #CBD5E1; border-radius: 10px; overflow: hidden">
<button type="button" aria-pressed="{{s.isPresent}}" onClick="{{s.setPresent}}" disabled="{{locked}}" style="height: 40px; border: 0; font-size: 13px; font-weight: 600; cursor: pointer; {{s.presentStyle}}">Present</button>
<button type="button" aria-pressed="{{s.absent}}" onClick="{{s.setAbsent}}" disabled="{{locked}}" style="height: 40px; border: 0; border-left: 1px solid #CBD5E1; font-size: 13px; font-weight: 600; cursor: pointer; {{s.absentStyle}}">Absent</button>
</div>
<sc-if value="{{s.showAbsentNote}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #FEF3F2">
<span style="font-size: 13px; color: #912018">{{s.absentNote}}</span>
<sc-if value="{{s.canMarkLate}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{s.markLate}}" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #7A3E00; background: #FFFFFF; color: #7A3E00; font-size: 13px; font-weight: 700; cursor: pointer">{{s.lateBtnLabel}}</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{s.isLate}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #FFF4E5; border: 1px solid #FBD38D; color: #7A3E00; font-size: 13px">
<strong>{{s.lateBadge}}</strong>
<sc-if value="{{s.canUndoLate}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{s.undoLate}}" style="border: 0; background: none; color: #7A3E00; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px">Undo</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.06em">Breakfast</span>
<span style="font-size: 13px; color: #7A3E00; background: #FFF4E5; padding: 8px 10px; border-radius: 10px">Missed — arrived after breakfast</span>
</div>
<sc-if value="{{isGSRP}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #085D3A; background: #ECFDF3; padding: 10px 12px; border-radius: 10px">Lunch served — no choices in GSRP.</p>
</sc-if>
<sc-for list="{{s.lateMeals}}" as="m" hint-placeholder-count="2">
<div role="group" aria-label="{{m.label}} for {{s.name}} (late arrival)" style="display: flex; flex-direction: column; gap: 6px">

<span style="font-size: 13px; color: #475569">{{submittedLine}} · Morning counts due by 9:00 AM, then auto-emailed to Food Service</span>
<sc-if value="{{hasLateAdds}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #7A3E00; background: #FFF4E5; border: 1px solid #FBD38D; padding: 6px 10px; border-radius: 8px; margin-top: 4px">Late arrivals: {{lateAddText}}</span>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{openEmail}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; cursor: pointer">Preview email</button>
<button type="button" onClick="{{exportMaster}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; cursor: pointer">Export PDF / CSV</button>
<button type="button" onClick="{{emailNow}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer">{{emailLabel}}</button>
</div>
</div>
<div role="group" aria-label="Meal" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{mealSeg}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid; font-size: 13px; font-weight: 600; cursor: pointer; {{o.style}}">{{o.label}}</button>
</sc-for>
</div>
<div style="overflow-x: auto; border: 1px solid #E2E8F0; border-radius: 12px">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 880px">
<thead><tr style="background: #F8FAFC; text-align: left">
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Classroom</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Teacher</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Status</th>
<sc-for list="{{optHeads}}" as="h" hint-placeholder-count="4">
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569; text-align: right">{{h}}</th>
</sc-for>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569; text-align: right">Absent</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569; text-align: right">Meals</th>
</tr></thead>
<tbody>
<sc-for list="{{mRows}}" as="r" hint-placeholder-count="8">
<tr style="border-top: 1px solid #EEF2F6">
<td style="padding: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.room}}</span><span style="font-size: 12px; color: #475569">{{r.school}} · {{r.grade}}</span></div></td>
<td style="padding: 12px; color: #334155">{{r.teacher}}</td>
<td style="padding: 12px">
<sc-if value="{{r.done}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; font-weight: 700; color: #085D3A; background: #ECFDF3; padding: 3px 8px; border-radius: 999px; white-space: nowrap">Signed {{r.time}}</span>
</sc-if>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: #912018; background: #FEF3F2; padding: 3px 8px; border-radius: 999px">Pending</span>
<button type="button" onClick="{{r.nudge}}" style="border: 0; background: none; color: #0A6E8C; font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 0; text-decoration: underline">{{r.nudgeLabel}}</button>
</span>
</sc-if>
</td>
<sc-for list="{{r.vals}}" as="v" hint-placeholder-count="4">
<td style="padding: 12px; text-align: right; font-variant-numeric: tabular-nums">{{v}}</td>
</sc-for>
<td style="padding: 12px; text-align: right; color: #912018; font-variant-numeric: tabular-nums">{{r.absent}}</td>
<td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{r.total}}</td>
</tr>
</sc-for>
<tr style="border-top: 2px solid #0F172A; background: #F8FAFC">
<th scope="row" colspan="3" style="padding: 12px; text-align: left">Total · {{scopeLabel}}</th>
<sc-for list="{{totVals}}" as="v" hint-placeholder-count="4">
<td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{v}}</td>
</sc-for>
<td style="padding: 12px; text-align: right; font-weight: 700; color: #912018; font-variant-numeric: tabular-nums">{{totAbsent}}</td>
<td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{totMeals}}</td>
</tr>
</tbody>
</table>
</div>
<sc-if value="{{hasG}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 16px">GSRP pre-K rooms · reported separately</h2>
<span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #ECFDF3; color: #085D3A">Confirmed: breakfast &amp; lunch only, no choices</span>
</div>
<div style="overflow-x: auto; border: 1px solid #E2E8F0; border-radius: 12px">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px">
<thead><tr style="background: #FFF8EE; text-align: left">
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Classroom</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Teacher</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Status</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569; text-align: right">Served (= present)</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569; text-align: right">Absent</th>
</tr></thead>
<tbody>
<sc-for list="{{gRows}}" as="g" hint-placeholder-count="2">
<tr style="border-top: 1px solid #EEF2F6">
<td style="padding: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{g.room}}</span><span style="font-size: 12px; color: #475569">{{g.school}} · {{g.grade}}</span></div></td>
<td style="padding: 12px; color: #334155">{{g.teacher}}</td>
<td style="padding: 12px"><span style="font-size: 12px; font-weight: 700; color: #085D3A; background: #ECFDF3; padding: 3px 8px; border-radius: 999px; white-space: nowrap">{{g.status}}</span></td>
<td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{g.served}}</td>
<td style="padding: 12px; text-align: right; color: #912018; font-variant-numeric: tabular-nums">{{g.absent}}</td>
</tr>
</sc-for>
<tr style="border-top: 2px solid #0F172A; background: #F8FAFC">
<th scope="row" colspan="3" style="padding: 12px; text-align: left">Total GSRP</th>
<td style="padding: 12px; text-align: right; font-weight: 700">{{gServed}}</td>
<td style="padding: 12px; text-align: right; font-weight: 700; color: #912018">{{gAbs}}</td>
</tr>
</tbody>
</table>
</div>
<span style="font-size: 14px; font-weight: 700">Kitchen total today ({{mealLower}}): {{grandMeals}} meals · K–5 {{totMeals}} + GSRP {{gServed}}</span>
</div>
</sc-if>
<p style="margin: 0; font-size: 12px; color: #475569">"Own" meals are recorded but left out of the Meals column, which is what the kitchen prepares.</p>
</section>
</sc-if>

<!-- ============ STUDENTS DIRECTORY ============ -->
<sc-if value="{{isStudents}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<section style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 280px; max-width: 420px">
<label for="q" style="font-size: 13px; font-weight: 600">Search students</label>
<input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Name or student ID" style="height: 46px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 15px; color: #0F172A">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 13px; color: #475569">{{dirCount}}</span>
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{openAdd}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer">Add student</button>
<button type="button" onClick="{{openImport}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; cursor: pointer">Import roster (CSV)</button>
</sc-if>
</div>
</section>
<section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px">
<sc-for list="{{dir}}" as="d" hint-placeholder-count="12">
<button type="button" onClick="{{d.open}}" style="text-align: left; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; color: #0F172A">
<div style="display: flex; align-items: center; gap: 12px">
<span class="{{d.photo}}" aria-hidden="true" style="display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #334155; flex: none; width: 56px; height: 56px; border-radius: 16px; {{d.photoBg}}">{{d.ini}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 700; font-size: 15px">{{d.name}}</span>
<span style="font-size: 12px; color: #475569">{{d.school}} · {{d.room}}</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #E6F6FA; color: #074F66">{{d.elig}}</span>
<sc-if value="{{d.hasAllergy}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #FFF4E5; color: #7A3E00">{{d.allergy}}</span>
</sc-if>
<sc-if value="{{d.latchkey}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #F6E8E8; color: #6B1719">Latchkey</span>
</sc-if>
</div>
</button>
</sc-for>
</section>
</div>
</sc-if>

<!-- ============ CLASSROOMS ============ -->
<sc-if value="{{isRooms}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px">Classrooms &amp; teachers</h1>
<span style="font-size: 13px; color: #475569">Each room type decides which meals appear on the teacher's register.</span>
</div>
<button type="button" onClick="{{openRoom}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer">Add classroom</button>
</div>
<div style="overflow-x: auto; border: 1px solid #E2E8F0; border-radius: 12px">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px">
<thead><tr style="background: #F8FAFC; text-align: left">
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Room</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Type</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Teacher</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Students</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Meals on register</th>
<th scope="col" style="padding: 12px; font-size: 12px; color: #475569">Reminders to</th>
</tr></thead>
<tbody>
<sc-for list="{{roomList}}" as="r" hint-placeholder-count="8">
<tr style="border-top: 1px solid #EEF2F6">
<td style="padding: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.room}}</span><span style="font-size: 12px; color: #475569">{{r.school}} Elementary</span></div></td>
<td style="padding: 12px"><span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; {{r.typeStyle}}">{{r.type}}</span></td>
<td style="padding: 12px">{{r.teacher}}</td>
<td style="padding: 12px">{{r.count}}</td>
<td style="padding: 12px; color: #334155">{{r.meals}}</td>
<td style="padding: 12px; color: #334155">Email + text</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="padding: 14px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #94A3B8; font-size: 13px; color: #334155; line-height: 1.5"><strong>GSRP rooms:</strong> requirements differ from K–5 (per Michael). Rules such as meal pattern and service style are placeholders until confirmed with Bryan — [GSRP RULES TBD].</div>
</section>
</sc-if>

<!-- ============ ENRICHMENT ============ -->
<sc-if value="{{isEnrichment}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #EAF2FF; border: 1px solid #C7D7F5; color: #1D3F8A; font-size: 14px">
<strong>District Enrichment Program · Phase 2 preview.</strong> Program name, data fields and the comparison measure are assumptions to confirm with Michael and Bryan.
</div>
<div role="tablist" aria-label="Programs" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<sc-for list="{{progTabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="text-align: left; padding: 14px; border-radius: 12px; border: 2px solid; cursor: pointer; display: flex; flex-direction: column; gap: 4px; {{t.style}}">
<span style="font-weight: 700; font-size: 15px">{{t.name}}</span>
<span style="font-size: 12px; opacity: 0.85">{{t.meta}}</span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px">Today's sign-in · {{prog.name}}</h2>
<span style="font-size: 13px; color: #475569">{{prog.meta}} · Lead: {{prog.lead}}</span>
</div>
<span style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #E6F6FA; color: #074F66">{{enrHere}} of {{enrTotal}} here</span>
</div>
<sc-for list="{{enrRoster}}" as="e" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #EEF2F6">
<span class="{{e.photo}}" aria-hidden="true" style="display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #334155; flex: none; width: 40px; height: 40px; border-radius: 999px; {{e.photoBg}}">{{e.ini}}</span>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{e.name}}</span><span style="font-size: 12px; color: #475569">{{e.room}} · {{e.school}}</span></div>
<button type="button" aria-pressed="{{e.here}}" onClick="{{e.toggle}}" style="height: 40px; min-width: 110px; padding: 0 12px; border-radius: 10px; border: 1.5px solid; font-size: 13px; font-weight: 700; cursor: pointer; {{e.style}}">{{e.label}}</button>
</div>
</sc-for>
</section>
<section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px">Attendance this week · {{prog.name}}</h2>
<div role="img" aria-label="Weekly attendance" style="display: flex; align-items: flex-end; gap: 12px; height: 180px; border-bottom: 1px solid #CBD5E1">
<sc-for list="{{enrBars}}" as="b" hint-placeholder-count="5">
<div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%">
<span style="font-size: 11px; font-weight: 600; color: #334155">{{b.v}}</span>
<div style="width: 70%; border-radius: 4px 4px 0 0; background: #1D3F8A; {{b.h}}"></div>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 12px">
<sc-for list="{{enrBars}}" as="b" hint-placeholder-count="5">
<span style="flex: 1 1 0; text-align: center; font-size: 12px; color: #475569">{{b.d}}</span>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: 12px; background: #E6F6FA; border: 1px solid #B6E3EF; color: #074F66">
<span style="font-size: 14px; line-height: 1.45"><strong>{{enrSnack}} after-school snacks</strong> added to today's kitchen count from enrichment sign-ins (all programs).</span>
<button type="button" onClick="{{sendSnack}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">Send to kitchen</button>
</div>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 640px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 18px">Enrichment attendance vs. student data · {{prog.name}}</h2>
<span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #EAF2FF; color: #1D3F8A">Assumption · Sample data</span>
</div>
<span style="font-size: 13px; color: #475569; line-height: 1.5">Michael asked to "chart that data against a child's…" — pick the measure to compare each student's enrichment attendance with.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cmp" style="font-size: 12px; font-weight: 600; color: #475569">Compare against</label>
<select id="cmp" value="{{cmp}}" onChange="{{onCmp}}" style="height: 42px; min-width: 220px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 14px; background: #FFFFFF; color: #0F172A">
<option value="0">School-day attendance</option>
<option value="1">Meal participation</option>
<option value="2">Grades / test scores</option>
</select>
</div>
</div>
<sc-if value="{{cmpConnected}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #334155">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #1D3F8A"></span>Enrichment attendance</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #13BFE3"></span>{{cmpLabel}}</span>
</div>
<sc-for list="{{cmpRows}}" as="c" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #EEF2F6">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<span class="{{c.photo}}" aria-hidden="true" style="display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #334155; flex: none; width: 34px; height: 34px; border-radius: 999px; {{c.photoBg}}">{{c.ini}}</span>
<span style="font-size: 14px; font-weight: 600">{{c.name}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1; height: 10px; background: #F1F5F9; border-radius: 999px; overflow: hidden"><div style="height: 100%; background: #1D3F8A; border-radius: 999px; {{c.aStyle}}"></div></div><span style="width: 40px; text-align: right; font-size: 12px; font-weight: 700">{{c.a}}</span></div>
<div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1; height: 10px; background: #F1F5F9; border-radius: 999px; overflow: hidden"><div style="height: 100%; background: #13BFE3; border-radius: 999px; {{c.bStyle}}"></div></div><span style="width: 40px; text-align: right; font-size: 12px; font-weight: 700">{{c.b}}</span></div>
</div>
</div>
</sc-for>
<p style="margin: 0; padding: 12px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; font-size: 14px; color: #0F172A">{{cmpInsight}}</p>
</div>
</sc-if>
<sc-if value="{{cmpMissing}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #94A3B8; font-size: 14px; color: #334155; line-height: 1.55">
<strong>Grades and test scores aren't connected yet.</strong> This needs an export from the district's student information system [SOURCE TBD]. Once connected, each student's enrichment attendance appears next to their grade or test-score trend.
</div>
</sc-if>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="rm-teacher" style="font-size: 13px; font-weight: 600">Teacher name *</label><input id="rm-teacher" type="text" value="{{rf.teacher}}" onChange="{{rOn.teacher}}" placeholder="e.g. Ms. Lauren Brooks" style="height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="rm-email" style="font-size: 13px; font-weight: 600">Teacher email (login)</label><input id="rm-email" type="email" value="{{rf.email}}" onChange="{{rOn.email}}" placeholder="name@hwschools.org" style="height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A"></div>
<div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="rm-phone" style="font-size: 13px; font-weight: 600">Mobile for text reminders</label><input id="rm-phone" type="tel" value="{{rf.phone}}" onChange="{{rOn.phone}}" placeholder="(313) 555-0100" style="height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A"></div>
</div>
<div style="padding: 16px 24px; border-top: 1px solid #E2E8F0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; background: #F8FAFC">
<span role="alert" style="font-size: 14px; color: #912018; font-weight: 600">{{roomErr}}</span>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{closeRoom}}" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 15px; cursor: pointer">Cancel</button>
<button type="button" onClick="{{saveRoom}}" style="height: 48px; padding: 0 22px; border-radius: 12px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer">Add classroom &amp; invite teacher</button>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: #0F172A; color: #FFFFFF; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(15,23,42,0.25); max-width: calc(100% - 32px)">{{toast}}</div>
</sc-if>
</sc-if>

</div>
</script>
<script src="js/runtime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
