<body>
  <div id="__bundler_placeholder">Loading MealTrack prototype...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9\")}\n.av-maya{background-image:url(\"6e73d39f-1bf7-48fb-a2bd-d92cc952e6f0\")}\n.av-nia{background-image:url(\"59e9dcea-9f6e-4f46-8609-35493d469ead\")}\n.av-noah{background-image:url(\"8576e3e7-1b48-4c2a-9f6a-3a76f6c95bfd\")}\n.av-riley{background-image:url(\"3c06623d-23a4-43eb-aee2-ccc96b1bdca4\")}\n.av-sofia{background-image:url(\"940a3b83-d7bf-4a7f-801f-f2d288fa910a\")}\n.av-zoe{background-image:url(\"5e1a50d2-0749-4ff0-9d1d-8a347bfd7e4d\")}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: #F4F6F9; font-family: Inter, system-ui, sans-serif; color: #0F172A\" data-canvas-width=\"1440\" data-canvas-height=\"1100\" data-document-role=\"page\" data-label=\"MealTrack — full clickable prototype\">\n\n<!-- ============ SIGN IN ============ -->\n<sc-if value=\"{{isLogin}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height: 100vh; display: flex; flex-wrap: wrap\">\n<section style=\"flex: 1 1 520px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; background: #FFFFFF\">\n<div style=\"width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px\">\n<img src=\"675c55e3-fbc1-492c-b7b5-de07dcd4908c\" alt=\"Ideal Technology Solutions, LLC\" style=\"width: 240px; height: auto; align-self: flex-start\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; letter-spacing: -0.02em\">Sign in to MealTrack<\u002Fh1>\n<p style=\"margin: 0; font-size: 15px; color: #475569\">Daily meal counts, attestations and reports for your school.<\u002Fp>\n<\u002Fdiv>\n<fieldset style=\"border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px\">\n<legend style=\"font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px\">I am signing in as<\u002Flegend>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{loginRoles}}\" as=\"r\" hint-placeholder-count=\"2\">\n<button type=\"button\" aria-pressed=\"{{r.on}}\" sc-camel-on-click=\"{{r.pick}}\" style=\"min-height: 52px; border-radius: 12px; border: 2px solid; font-size: 14px; font-weight: 600; cursor: pointer; {{r.style}}\">{{r.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"lg-school\" style=\"font-size: 13px; font-weight: 600; color: #334155\">School<\u002Flabel>\n<sc-raw-select id=\"lg-school\" value=\"{{loginSchool}}\" sc-camel-on-change=\"{{onLoginSchool}}\" style=\"height: 48px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 15px; background: #FFFFFF; color: #0F172A\">\n<option value=\"Beacon\">Beacon Elementary School<\u002Foption>\n<option value=\"Tyrone\">Tyrone Elementary School<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"lg-email\" style=\"font-size: 13px; font-weight: 600; color: #334155\">School email<\u002Flabel>\n<input id=\"lg-email\" type=\"email\" value=\"{{loginEmail}}\" sc-camel-on-change=\"{{onLoginEmail}}\" placeholder=\"name@hwschools.org\" autocomplete=\"username\" style=\"height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"lg-pw\" style=\"font-size: 13px; font-weight: 600; color: #334155\">Password<\u002Flabel>\n<input id=\"lg-pw\" type=\"password\" value=\"{{loginPw}}\" sc-camel-on-change=\"{{onLoginPw}}\" autocomplete=\"current-password\" style=\"height: 48px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A\">\n<\u002Fdiv>\n<sc-if value=\"{{hasLoginErr}}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin: 0; padding: 10px 12px; border-radius: 10px; background: #FEF3F2; border: 1px solid #FECDCA; color: #912018; font-size: 14px\">{{loginErr}}<\u002Fp>\n<\u002Fsc-if>\n<button type=\"button\" sc-camel-on-click=\"{{signIn}}\" style=\"height: 52px; border-radius: 12px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 16px; cursor: pointer\">Sign in<\u002Fbutton>\n<p style=\"margin: 0; font-size: 13px; color: #475569; text-align: center\">or sign in with your district Google / Microsoft account<\u002Fp>\n<div style=\"border: 1px dashed #94A3B8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #F8FAFC\">\n<span style=\"font-size: 12px; font-weight: 700; color: #475569; letter-spacing: 0.06em; text-transform: uppercase\">Sample accounts for the demo · tap to fill<\u002Fspan>\n<sc-for list=\"{{sampleAccts}}\" as=\"a\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{a.fill}}\" style=\"display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; cursor: pointer; color: #0F172A\">\n<span aria-hidden=\"true\" style=\"width: 36px; height: 36px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px; font-weight: 700; {{a.avStyle}}\">{{a.ini}}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1\"><span style=\"font-weight: 600; font-size: 14px\">{{a.name}} · {{a.where}}<\u002Fspan><span style=\"font-size: 12px; color: #475569; font-family: ui-monospace, Menlo, monospace\">{{a.email}} / {{a.pw}}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section style=\"flex: 1 1 520px; background: #0F172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 48px 24px\">\n<div style=\"width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; align-items: center; gap: 16px; background: #FFFFFF; color: #0F172A; border-radius: 16px; padding: 14px 18px; align-self: flex-start\">\n<img src=\"c8b861fa-1d76-4192-8c64-139fd9fbb79a\" alt=\"Harper Woods Schools\" style=\"width: 56px; height: 56px; object-fit: contain\">\n<div style=\"display: flex; flex-direction: column; line-height: 1.25\">\n<span style=\"font-size: 12px; color: #475569; font-weight: 500\">Licensed to<\u002Fspan>\n<span style=\"font-size: 17px; font-weight: 700; color: #6B1719\">Harper Woods Schools<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 38px; line-height: 1.1; letter-spacing: -0.02em\">Every child counted, every meal accounted for.<\u002Fh2>\n<div style=\"display: flex; gap: -10px\">\n<sc-for list=\"{{loginFaces}}\" as=\"f\" hint-placeholder-count=\"6\">\n<span class=\"{{f.photo}}\" aria-hidden=\"true\" style=\"display: block; flex: none; width: 56px; height: 56px; border-radius: 999px; border: 3px solid #0F172A; margin-right: -12px; {{f.photoBg}}\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"font-size: 15px; line-height: 1.5; color: #E2E8F0\">Teachers tap each child's breakfast, lunch, snack or dinner — the screen switches by time of day.<\u002Fli>\n<li style=\"font-size: 15px; line-height: 1.5; color: #E2E8F0\">Submit with a typed digital signature — the attestation goes straight to Food Service.<\u002Fli>\n<li style=\"font-size: 15px; line-height: 1.5; color: #E2E8F0\">Room and school master reports are emailed and saved for charts by day, week and month.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0; font-size: 13px; color: #94A3B8\">Beacon Elementary · Tyrone Elementary — MealTrack is a product of Ideal Technology Solutions, LLC.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ APP \u002Fh1>\n<span style=\"font-size: 13px; color: #475569\">Each room type decides which meals appear on the teacher's register.<\u002Fspan>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{openRoom}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer\">Add classroom<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"overflow-x: auto; border: 1px solid #E2E8F0; border-radius: 12px\">\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px\">\n<sc-raw-thead><sc-raw-tr style=\"background: #F8FAFC; text-align: left\">\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Room<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Type<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Teacher<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Students<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Meals on register<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 12px; font-size: 12px; color: #475569\">Reminders to<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{roomList}}\" as=\"r\" hint-placeholder-count=\"8\">\n<sc-raw-tr style=\"border-top: 1px solid #EEF2F6\">\n<sc-raw-td style=\"padding: 12px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{r.room}}<\u002Fspan><span style=\"font-size: 12px; color: #475569\">{{r.school}} Elementary<\u002Fspan><\u002Fdiv><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px\"><span style=\"font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; {{r.typeStyle}}\">{{r.type}}<\u002Fspan><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px\">{{r.teacher}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px\">{{r.count}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; color: #334155\">{{r.meals}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; color: #334155\">Email + text<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"padding: 14px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #94A3B8; font-size: 13px; color: #334155; line-height: 1.5\"><strong>GSRP rooms:<\u002Fstrong> requirements differ from K–5 (per Michael). Rules such as meal pattern and service style are placeholders until confirmed with Bryan — [GSRP RULES TBD].<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ ENRICHMENT ============ -->\n<sc-if value=\"{{isEnrichment}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #EAF2FF; border: 1px solid #C7D7F5; color: #1D3F8A; font-size: 14px\">\n<strong>District Enrichment Program · Phase 2 preview.<\u002Fstrong> Program name, data fields and the comparison measure are assumptions to confirm with Michael and Bryan.\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Programs\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px\">\n<sc-for list=\"{{progTabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.on}}\" sc-camel-on-click=\"{{t.pick}}\" style=\"text-align: left; padding: 14px; border-radius: 12px; border: 2px solid; cursor: pointer; display: flex; flex-direction: column; gap: 4px; {{t.style}}\">\n<span style=\"font-weight: 700; font-size: 15px\">{{t.name}}<\u002Fspan>\n<span style=\"font-size: 12px; opacity: 0.85\">{{t.meta}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px\">\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<h2 style=\"margin: 0; font-size: 18px\">Today's sign-in · {{prog.name}}<\u002Fh2>\n<span style=\"font-size: 13px; color: #475569\">{{prog.meta}} · Lead: {{prog.lead}}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #E6F6FA; color: #074F66\">{{enrHere}} of {{enrTotal}} here<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{enrRoster}}\" as=\"e\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #EEF2F6\">\n<span class=\"{{e.photo}}\" aria-hidden=\"true\" style=\"display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #334155; flex: none; width: 40px; height: 40px; border-radius: 999px; {{e.photoBg}}\">{{e.ini}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; flex: 1; min-width: 0\"><span style=\"font-weight: 600; font-size: 14px\">{{e.name}}<\u002Fspan><span style=\"font-size: 12px; color: #475569\">{{e.room}} · {{e.school}}<\u002Fspan><\u002Fdiv>\n<button type=\"button\" aria-pressed=\"{{e.here}}\" sc-camel-on-click=\"{{e.toggle}}\" style=\"height: 40px; min-width: 110px; padding: 0 12px; border-radius: 10px; border: 1.5px solid; font-size: 13px; font-weight: 700; cursor: pointer; {{e.style}}\">{{e.label}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 18px\">Attendance this week · {{prog.name}}<\u002Fh2>\n<div role=\"img\" aria-label=\"Weekly attendance\" style=\"display: flex; align-items: flex-end; gap: 12px; height: 180px; border-bottom: 1px solid #CBD5E1\">\n<sc-for list=\"{{enrBars}}\" as=\"b\" hint-placeholder-count=\"5\">\n<div style=\"flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%\">\n<span style=\"font-size: 11px; font-weight: 600; color: #334155\">{{b.v}}<\u002Fspan>\n<div style=\"width: 70%; border-radius: 4px 4px 0 0; background: #1D3F8A; {{b.h}}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px\">\n<sc-for list=\"{{enrBars}}\" as=\"b\" hint-placeholder-count=\"5\">\n<span style=\"flex: 1 1 0; text-align: center; font-size: 12px; color: #475569\">{{b.d}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: 12px; background: #E6F6FA; border: 1px solid #B6E3EF; color: #074F66\">\n<span style=\"font-size: 14px; line-height: 1.45\"><strong>{{enrSnack}} after-school snacks<\u002Fstrong> added to today's kitchen count from enrichment sign-ins (all programs).<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{sendSnack}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer\">Send to kitchen<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 640px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 18px\">Enrichment attendance vs. student data · {{prog.name}}<\u002Fh2>\n<span style=\"font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #EAF2FF; color: #1D3F8A\">Assumption · Sample data<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size: 13px; color: #475569; line-height: 1.5\">Michael asked to \"chart that data against a child's…\" — pick the measure to compare each student's enrichment attendance with.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"cmp\" style=\"font-size: 12px; font-weight: 600; color: #475569\">Compare against<\u002Flabel>\n<sc-raw-select id=\"cmp\" value=\"{{cmp}}\" sc-camel-on-change=\"{{onCmp}}\" style=\"height: 42px; min-width: 220px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 14px; background: #FFFFFF; color: #0F172A\">\n<option value=\"0\">School-day attendance<\u002Foption>\n<option value=\"1\">Meal participation<\u002Foption>\n<option value=\"2\">Grades / test scores<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{cmpConnected}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #334155\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 12px; height: 12px; border-radius: 3px; background: #1D3F8A\"><\u002Fspan>Enrichment attendance<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 12px; height: 12px; border-radius: 3px; background: #13BFE3\"><\u002Fspan>{{cmpLabel}}<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{cmpRows}}\" as=\"c\" hint-placeholder-count=\"5\">\n<div style=\"display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #EEF2F6\">\n<div style=\"display: flex; align-items: center; gap: 10px; min-width: 0\">\n<span class=\"{{c.photo}}\" aria-hidden=\"true\" style=\"display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #334155; flex: none; width: 34px; height: 34px; border-radius: 999px; {{c.photoBg}}\">{{c.ini}}<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 600\">{{c.name}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<div style=\"display: flex; align-items: center; gap: 8px\"><div style=\"flex: 1; height: 10px; background: #F1F5F9; border-radius: 999px; overflow: hidden\"><div style=\"height: 100%; background: #1D3F8A; border-radius: 999px; {{c.aStyle}}\"><\u002Fdiv><\u002Fdiv><span style=\"width: 40px; text-align: right; font-size: 12px; font-weight: 700\">{{c.a}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px\"><div style=\"flex: 1; height: 10px; background: #F1F5F9; border-radius: 999px; overflow: hidden\"><div style=\"height: 100%; background: #13BFE3; border-radius: 999px; {{c.bStyle}}\"><\u002Fdiv><\u002Fdiv><span style=\"width: 40px; text-align: right; font-size: 12px; font-weight: 700\">{{c.b}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<p style=\"margin: 0; padding: 12px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; font-size: 14px; color: #0F172A\">{{cmpInsight}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{cmpMissing}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 16px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #94A3B8; font-size: 14px; color: #334155; line-height: 1.55\">\n<strong>Grades and test scores aren't connected yet.<\u002Fstrong> This needs an export from the district's student information system [SOURCE TBD]. Once connected, each student's enrichment attendance appears next to their grade or test-score trend.\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ LATCHKEY ============ -->\n<sc-if value=\"{{isLatchkey}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #F6E8E8; border: 1px solid #E5C4C4; color: #6B1719; font-size: 14px\">\n<span><strong>Free module.<\u002Fstrong> Latchkey is included at no cost with the Harper Woods Schools MealTrack license.<\u002Fspan>\n<\u002Fdiv>\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px\">\n<sc-for list=\"{{lkKpis}}\" as=\"k\" hint-placeholder-count=\"3\">\n<div style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 13px; color: #475569; font-weight: 600\">{{k.label}}<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{k.value}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px\">\n<h2 style=\"margin: 0 0 8px; font-size: 18px\">After-school check-in &amp; pick-up<\u002Fh2>\n<sc-for list=\"{{lk}}\" as=\"l\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #EEF2F6\">\n<span class=\"{{l.photo}}\" aria-hidden=\"true\" style=\"display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #334155; flex: none; width: 44px; height: 44px; border-radius: 999px; {{l.photoBg}}\">{{l.ini}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; flex: 1 1 180px; min-width: 0\"><span style=\"font-weight: 600; font-size: 14px\">{{l.name}}<\u002Fspan><span style=\"font-size: 12px; color: #475569\">{{l.room}} · {{l.school}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; flex: 1 1 200px; font-size: 13px\"><span style=\"font-weight: 600; {{l.statusStyle}}\">{{l.status}}<\u002Fspan><span style=\"color: #475569\">Authorized: {{l.auth}}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{l.canIn}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{l.checkIn}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer\">Check in<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{l.canOut}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{l.checkOut}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #6B1719; background: #FFFFFF; color: #6B1719; font-size: 13px; font-weight: 700; cursor: pointer\">Check out to {{l.firstGuardian}}<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ REMINDERS ============ -->\n<sc-if value=\"{{isReminders}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden\">\n<div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 4px\">\n<h2 style=\"margin: 0; font-size: 18px\">Teacher reminder schedule<\u002Fh2>\n<span style=\"font-size: 13px; color: #475569\">Sent only to teachers who haven't submitted that meal yet · school days only<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{remRows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"padding: 14px 20px; border-top: 1px solid #EEF2F6; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px\">\n<div style=\"display: flex; align-items: center; gap: 12px; flex: 1 1 220px\">\n<button type=\"button\" role=\"switch\" aria-checked=\"{{r.on}}\" aria-label=\"{{r.label}} reminder\" sc-camel-on-click=\"{{r.toggle}}\" style=\"width: 52px; height: 30px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; display: flex; flex: none; {{r.trackStyle}}\">\n<span aria-hidden=\"true\" style=\"width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15,23,42,0.3)\"><\u002Fspan>\n<\u002Fbutton>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 700; font-size: 15px\">{{r.label}}<\u002Fspan><span style=\"font-size: 12px; color: #475569\">{{r.note}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"{{r.tid}}\" style=\"font-size: 12px; font-weight: 600; color: #475569\">Send at<\u002Flabel>\n<input id=\"{{r.tid}}\" type=\"time\" value=\"{{r.time}}\" sc-camel-on-change=\"{{r.onTime}}\" style=\"height: 42px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 14px; color: #0F172A\">\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"{{r.label}} channels\" style=\"display: flex; gap: 8px\">\n<button type=\"button\" aria-pressed=\"{{r.email}}\" sc-camel-on-click=\"{{r.toggleEmail}}\" style=\"height: 42px; padding: 0 14px; border-radius: 10px; border: 1.5px solid; font-size: 14px; font-weight: 600; cursor: pointer; {{r.emailStyle}}\">Email<\u002Fbutton>\n<button type=\"button\" aria-pressed=\"{{r.sms}}\" sc-camel-on-click=\"{{r.toggleSms}}\" style=\"height: 42px; padding: 0 14px; border-radius: 10px; border: 1.5px solid; font-size: 14px; font-weight: 600; cursor: pointer; {{r.smsStyle}}\">Text<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<section style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 18px\">Automatic reports<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px\">\n<div style=\"border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #074F66; background: #E6F6FA; padding: 3px 8px; border-radius: 999px; align-self: flex-start\">When a teacher signs<\u002Fspan>\n<span style=\"font-weight: 700\">Room report<\u002Fspan>\n<span style=\"font-size: 13px; color: #475569; line-height: 1.5\">Students with photos, attendance and meal choice, counts per option, typed signature and time stamp.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #6B1719; background: #F6E8E8; padding: 3px 8px; border-radius: 999px; align-self: flex-start\">At each meal cut-off<\u002Fspan>\n<span style=\"font-weight: 700\">School master report<\u002Fspan>\n<span style=\"font-size: 13px; color: #475569; line-height: 1.5\">Every classroom's counts with the school total and rooms still pending.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"rcpt\" style=\"font-size: 13px; font-weight: 600\">Send reports to<\u002Flabel>\n<input id=\"rcpt\" type=\"text\" value=\"{{rcpt}}\" sc-camel-on-change=\"{{onRcpt}}\" style=\"height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 14px; color: #0F172A\">\n<button type=\"button\" sc-camel-on-click=\"{{saveReminders}}\" style=\"align-self: flex-start; margin-top: 6px; height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer\">Save settings<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<aside aria-label=\"Text preview\" style=\"flex: 1 1 320px; min-width: 0; background: #0F172A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #94A3B8; letter-spacing: 0.06em; text-transform: uppercase\">Text message preview<\u002Fspan>\n<div style=\"background: #1E293B; color: #F1F5F9; border-radius: 18px 18px 18px 4px; padding: 14px 16px; font-size: 14px; line-height: 1.5\">MealTrack: Good morning Ms. Ellis — today's breakfast, lunch and dinner count for Room 205 is due by 9:00 AM. Tap to fill it out: mealtrack.app/r/205<\u002Fdiv>\n<div style=\"background: #1E293B; color: #F1F5F9; border-radius: 18px 18px 18px 4px; padding: 14px 16px; font-size: 14px; line-height: 1.5\">MealTrack: Last call — Room 205's meal count is due at 9:00 AM. 10 students still to record.<\u002Fdiv>\n<span style=\"font-size: 12px; color: #94A3B8\">Sent from MealTrack · reply STOP to opt out<\u002Fspan>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MODULES ============ -->\n<sc-if value=\"{{isModules}}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px\">\n<article style=\"background: #FFFFFF; border: 2px solid #0A6E8C; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #085D3A; background: #ECFDF3; padding: 4px 10px; border-radius: 999px; align-self: flex-start\">Active · Phase 1<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 22px; font-family: 'Space Grotesk', sans-serif\">Meal Management<\u002Fh2>\n<p style=\"margin: 0; font-size: 14px; color: #475569; line-height: 1.55\">Attendance and meal choice per student for breakfast, lunch, snack and dinner, with signed attestations, master reports and charts.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{goMaster}}\" style=\"margin-top: auto; height: 46px; border-radius: 12px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer\">Open master report<\u002Fbutton>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #1D3F8A; background: #EAF2FF; padding: 4px 10px; border-radius: 999px; align-self: flex-start\">Phase 2 · Preview<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 22px; font-family: 'Space Grotesk', sans-serif\">Enrichment Tracking<\u002Fh2>\n<p style=\"margin: 0; font-size: 14px; color: #475569; line-height: 1.55\">Daily sign-in for each enrichment program, enrollment by school, and attendance trends charted against student data.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{goEnrichment}}\" style=\"margin-top: auto; height: 46px; border-radius: 12px; border: 1.5px solid #1D3F8A; background: #FFFFFF; color: #1D3F8A; font-weight: 700; font-size: 15px; cursor: pointer\">Preview enrichment<\u002Fbutton>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #6B1719; background: #F6E8E8; padding: 4px 10px; border-radius: 999px; align-self: flex-start\">Free module<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 22px; font-family: 'Space Grotesk', sans-serif\">Latchkey<\u002Fh2>\n<p style=\"margin: 0; font-size: 14px; color: #475569; line-height: 1.55\">After-school check-in and pick-up with authorized guardians, linked to snack and dinner counts. Included at no cost.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{goLatchkey}}\" style=\"margin-top: auto; height: 46px; border-radius: 12px; border: 1.5px solid #6B1719; background: #FFFFFF; color: #6B1719; font-weight: 700; font-size: 15px; cursor: pointer\">Open latchkey<\u002Fbutton>\n<\u002Farticle>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: #475569; padding: 8px 0 16px\">\n<span>MealTrack by Ideal Technology Solutions, LLC<\u002Fspan>\n<span>Licensed to Harper Woods Schools · Beacon Elementary &amp; Tyrone Elementary<\u002Fspan>\n<\u002Ffooter>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ MODALS ============ -->\n<sc-if value=\"{{modal}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 50\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"att-title\" style=\"background: #FFFFFF; border-radius: 18px; width: 100%; max-width: 760px; display: flex; flex-direction: column; overflow: hidden\">\n<div style=\"padding: 20px 24px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 14px\">\n<img src=\"c8b861fa-1d76-4192-8c64-139fd9fbb79a\" alt=\"\" style=\"height: 44px; width: 44px; object-fit: contain\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1\">\n<h2 id=\"att-title\" style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px\">{{periodLabel}} attestation · {{tRoom}}<\u002Fh2>\n<span style=\"font-size: 13px; color: #475569\">{{tSchoolFull}} · {{userName}} · {{today}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 16px 24px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{optCounts}}\" as=\"oc\" hint-placeholder-count=\"3\">\n<span style=\"padding: 6px 10px; border-radius: 8px; background: #E6F6FA; color: #074F66; font-size: 13px\"><strong>{{oc.n}}<\u002Fstrong> {{oc.label}}<\u002Fspan>\n<\u002Fsc-for>\n<span style=\"padding: 6px 10px; border-radius: 8px; background: #FEF3F2; color: #912018; font-size: 13px\"><strong>{{absent}}<\u002Fstrong> absent<\u002Fspan>\n<\u002Fdiv>\n<div style=\"max-height: 340px; overflow-y: auto; border: 1px solid #E2E8F0; border-radius: 12px\">\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px\">\n<sc-raw-thead><sc-raw-tr style=\"background: #F8FAFC; text-align: left\">\n<sc-raw-th scope=\"col\" style=\"padding: 10px 12px; font-size: 12px; color: #475569\">Student<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 10px 12px; font-size: 12px; color: #475569\">Attendance<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 10px 12px; font-size: 12px; color: #475569\">{{periodLabel}}<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{cards}}\" as=\"s\" hint-placeholder-count=\"8\">\n<sc-raw-tr style=\"border-top: 1px solid #EEF2F6\">\n<sc-raw-td style=\"padding: 8px 12px\"><div style=\"display: flex; align-items: center; gap: 10px\"><span class=\"{{s.photo}}\" aria-hidden=\"true\" style=\"display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #334155; flex: none; width: 34px; height: 34px; border-radius: 999px; {{s.photoBg}}\">{{s.ini}}<\u002Fspan><span style=\"font-weight: 600\">{{s.name}}<\u002Fspan><\u002Fdiv><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 8px 12px; {{s.attCellStyle}}\">{{s.attText}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 8px 12px; font-weight: 600\">{{s.choiceText}}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px\">I attest that the students listed above elected to receive {{periodLower}} on {{today}} as recorded, and that students marked absent did not receive a meal for this period.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"sig\" style=\"font-size: 13px; font-weight: 600\">Type your full name as your digital signature<\u002Flabel>\n<input id=\"sig\" type=\"text\" value=\"{{sig}}\" sc-camel-on-change=\"{{onSig}}\" placeholder=\"e.g. {{tSigName}}\" autocomplete=\"name\" style=\"height: 48px; padding: 0 14px; border: 1px solid #94A3B8; border-radius: 10px; font-size: 18px; font-family: 'Space Grotesk', sans-serif; font-style: italic; color: #0F172A\">\n<\u002Fdiv>\n<label style=\"display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; min-height: 44px\">\n<input type=\"checkbox\" checked=\"{{agree}}\" sc-camel-on-change=\"{{onAgree}}\" style=\"width: 20px; height: 20px; accent-color: #0A6E8C\">\n<span>I confirm this {{periodLower}} count is accurate.<\u002Fspan>\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"padding: 16px 24px; border-top: 1px solid #E2E8F0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; background: #F8FAFC\">\n<button type=\"button\" sc-camel-on-click=\"{{closeModal}}\" style=\"height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 15px; cursor: pointer\">Back to register<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{sign}}\" disabled=\"{{cantSign}}\" style=\"height: 48px; padding: 0 22px; border-radius: 12px; border: 0; font-weight: 700; font-size: 15px; {{signStyle}}\">Sign &amp; submit<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"done-title\" style=\"background: #FFFFFF; border-radius: 18px; width: 100%; max-width: 520px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div aria-hidden=\"true\" style=\"width: 56px; height: 56px; border-radius: 999px; background: #ECFDF3; display: flex; align-items: center; justify-content: center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#067647\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h2 id=\"done-title\" style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px\">{{periodLabel}} count submitted<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; color: #334155; line-height: 1.5\">Signed by <strong>{{sig}}<\u002Fstrong>. What happened next:<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #334155; line-height: 1.45\">\n<li>{{tRoom}} report emailed to the Food Service Admin.<\u002Fli>\n<li>Counts added to today's {{tSchoolFull}} master report.<\u002Fli>\n<li>Saved to My submissions and to Reports for charts.<\u002Fli>\n<\u002Ful>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end\">\n<button type=\"button\" sc-camel-on-click=\"{{goHistory}}\" style=\"height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 15px; cursor: pointer\">View my submissions<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{closeDone}}\" style=\"height: 48px; padding: 0 22px; border-radius: 12px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer\">Done<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{emailOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 50\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"em-title\" style=\"background: #FFFFFF; border-radius: 18px; width: 100%; max-width: 640px; overflow: hidden\">\n<div style=\"padding: 14px 20px; background: #F8FAFC; border-bottom: 1px solid #E2E8F0; font-size: 13px; color: #475569; display: flex; flex-direction: column; gap: 3px\">\n<span id=\"em-title\"><strong style=\"color: #0F172A\">Subject:<\u002Fstrong> {{mealLabel}} master report — {{scopeLabel}} — {{todayShort}}<\u002Fspan>\n<span><strong style=\"color: #0F172A\">To:<\u002Fstrong> Food Service Admin; Kitchen Manager<\u002Fspan>\n<span><strong style=\"color: #0F172A\">From:<\u002Fstrong> MealTrack (no-reply)<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\">\n<img src=\"675c55e3-fbc1-492c-b7b5-de07dcd4908c\" alt=\"Ideal Technology Solutions\" style=\"height: 30px; width: auto\">\n<img src=\"c8b861fa-1d76-4192-8c64-139fd9fbb79a\" alt=\"Harper Woods Schools\" style=\"height: 40px; width: 40px; object-fit: contain\">\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5\">Today's {{mealLower}} counts: <strong>{{grandMeals}} meals<\u002Fstrong> to prepare (GSRP included). {{submittedLine}}.<\u002Fp>\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 13px\">\n<sc-raw-thead><sc-raw-tr style=\"text-align: left; color: #475569\"><sc-raw-th scope=\"col\" style=\"padding: 6px 4px\">Room<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px 4px\">School<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px 4px; text-align: right\">Meals<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px 4px; text-align: right\">Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{mRows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<sc-raw-tr style=\"border-top: 1px solid #EEF2F6\"><sc-raw-td style=\"padding: 6px 4px\">{{r.room}}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px\">{{r.school}}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px; text-align: right; font-weight: 600\">{{r.total}}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px; text-align: right; {{r.statusStyle}}\">{{r.statusText}}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<sc-for list=\"{{gRows}}\" as=\"g\" hint-placeholder-count=\"1\">\n<sc-raw-tr style=\"border-top: 1px solid #EEF2F6; background: #FFF8EE\"><sc-raw-td style=\"padding: 6px 4px\">{{g.room}} (GSRP)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px\">{{g.school}}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px; text-align: right; font-weight: 600\">{{g.total}}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px; text-align: right; {{g.statusStyle}}\">{{g.statusText}}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<sc-raw-tr style=\"border-top: 2px solid #0F172A; font-weight: 700\"><sc-raw-td colspan=\"2\" style=\"padding: 6px 4px\">Total<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 4px; text-align: right\">{{grandMeals}}<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<span style=\"font-size: 12px; color: #475569\">Room reports with student names and signatures are attached as PDF.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 14px 20px; border-top: 1px solid #E2E8F0; display: flex; justify-content: flex-end; background: #F8FAFC\">\n<button type=\"button\" sc-camel-on-click=\"{{closeEmail}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #0A6E8C; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer\">Close preview<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ ADD / EDIT STUDENT ============ -->\n<sc-if value=\"{{formOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 50\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sf-title\" style=\"background: #FFFFFF; border-radius: 18px; width: 100%; max-width: 900px; display: flex; flex-direction: column; overflow: hidden\">\n<div style=\"padding: 18px 24px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<h2 id=\"sf-title\" style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px\">{{formTitle}}<\u002Fh2>\n<span style=\"font-size: 13px; color: #475569\">Fields marked * are required. The student appears on their teacher's register right away.<\u002Fspan>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{closeForm}}\" aria-label=\"Close\" style=\"width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; cursor: pointer; font-size: 20px; color: #334155\">×<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 250px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 13px; font-weight: 600\">Profile photo<\u002Fspan>\n<span class=\"{{fp.photo}}\" role=\"img\" aria-label=\"Selected photo\" style=\"display: flex; align-items: center; justify-content: center; width: 120px; height: 120px; border-radius: 24px; font-size: 36px; font-weight: 700; color: #334155; {{fp.photoBg}}\">{{fp.ini}}<\u002Fspan>\n<label style=\"display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden\">Upload photo<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{onUpload}}\" style=\"position: absolute; inset: 0; opacity: 0; cursor: pointer\"><\u002Flabel>\n<span style=\"font-size: 12px; color: #475569\">Or pick a sample picture:<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(6, 38px); gap: 6px\">\n<sc-for list=\"{{avatars}}\" as=\"a\" hint-placeholder-count=\"24\">\n<button type=\"button\" aria-label=\"Sample picture {{a.n}}\" aria-pressed=\"{{a.on}}\" sc-camel-on-click=\"{{a.pick}}\" style=\"width: 38px; height: 38px; padding: 0; border-radius: 999px; border: 3px solid; cursor: pointer; background: #FFFFFF; {{a.ring}}\"><span class=\"{{a.cls}}\" style=\"display: block; width: 100%; height: 100%; border-radius: 999px\"><\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 440px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sf-first\" style=\"font-size: 13px; font-weight: 600\">First name *<\u002Flabel><input id=\"sf-first\" type=\"text\" value=\"{{f.first}}\" sc-camel-on-change=\"{{fOn.first}}\" style=\"height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sf-last\" style=\"font-size: 13px; font-weight: 600\">Last name *<\u002Flabel><input id=\"sf-last\" type=\"text\" value=\"{{f.last}}\" sc-camel-on-change=\"{{fOn.last}}\" style=\"height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sf-sid\" style=\"font-size: 13px; font-weight: 600\">Student ID *<\u002Flabel><input id=\"
